name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION is not a valid stable Semantic Version: ${version}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${version})" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install --yes openscad

      - name: Build all STL files
        run: bash scripts/build_all.sh dist

      - name: Package release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip -j "dist/dip-socket-trays-${VERSION}.zip" dist/*.stl
          cd dist
          sha256sum *.stl "dip-socket-trays-${VERSION}.zip" > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/dip-socket-trays-${VERSION}.zip" \
            "dist/SHA256SUMS" \
            --verify-tag \
            --generate-notes \
            --title "Parametric DIP socket trays v${VERSION}"
